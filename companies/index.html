<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070c2b">
<title>네트워킹 데이 참여기업</title>
<link rel="preload" href="fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  --night:#070c2b; --deep:#0c1645; --line:#1d2a6b; --ink:#eef1ff; --mute:#8f9bd0; --volt:#4c86ff; --glow:#7fe3ff;
  --font:'Paperlogy',-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.65 var(--font);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;
  background:radial-gradient(90% 520px at 50% 0,#14236a 0%,var(--night) 100%) no-repeat,var(--night)}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* 표지 */
.cover{padding-top:40px;padding-bottom:8px}
.logo{display:block;height:18px;width:auto;margin:0 0 24px}
.eyebrow{margin:0;font-size:13px;font-weight:500;color:var(--mute)}
h1{margin:4px 0 0;font:800 46px/1.1 var(--font);letter-spacing:-1.5px}
.date{margin:10px 0 0;font:500 16px var(--font);color:var(--glow);letter-spacing:.3px}

/* 분야별 블록 */
.city{margin:30px 0 0}
#towers{display:block;width:100%;height:auto;overflow:visible}
.tower{cursor:pointer;transition:opacity .2s}
.city.has-pick .tower{opacity:.22}
.city.has-pick .tower.on{opacity:1}
.tower text{font:600 11px var(--font);fill:var(--ink)}
.cube{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.caption{margin:10px 0 0;font-size:13px;color:var(--mute)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;margin:14px 0 0;padding:0;list-style:none}
.legend button{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;padding:6px 0;font-size:12.5px;line-height:1.35;color:var(--mute)}
.legend button[aria-pressed="true"]{color:var(--ink)}
.legend button[aria-pressed="true"] .nm{text-decoration:underline;text-underline-offset:3px}
.legend svg{flex:none;margin-top:1px}
.legend .n{font-weight:600;color:var(--ink);margin-left:3px}

/* 검색 줄 */
.bar{position:sticky;top:0;z-index:5;margin-top:26px;background:var(--night);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:54px}
.bar input{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:16px;padding:6px 0;outline:none}
.bar input::placeholder{color:var(--mute)}
.bar input:focus{border-bottom-color:var(--volt)}
.type{display:flex;gap:12px;font-size:13px;color:var(--mute);flex:none}
.type button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.status{display:flex;justify-content:space-between;gap:12px;padding:12px 0 0;font-size:13px;color:var(--mute)}
.status button{color:var(--glow)}

/* 디렉터리 */
.group{margin:28px 0 0}
.initial{display:flex;align-items:baseline;gap:10px;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line);font:700 26px var(--font);color:var(--volt)}
.initial small{font:12px var(--font);color:var(--mute)}
.co{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 12px;padding:18px 0;border-bottom:1px solid var(--line)}
.co>svg{margin-top:5px}
.co h2{margin:0;font:700 20px/1.35 var(--font);letter-spacing:-.3px}
.meta{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.meta .demand{color:#ffd37a}
.lab{margin:12px 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.4px;color:var(--mute)}
.co ul{margin:0;padding:0;list-style:none}
.co li{position:relative;padding-left:12px}
.co li::before{content:"";position:absolute;left:0;top:.8em;width:5px;height:1px;background:var(--mute)}
.svc{color:#c9d1f5}
.need{border-left:2px solid var(--c);padding:2px 0 2px 12px;margin-left:-14px;padding-left:12px}
.need li{color:var(--ink)}
mark{background:var(--glow);color:var(--night);border-radius:2px;padding:0 1px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
footer{padding:48px 0 40px;text-align:center;font:600 12px var(--font);letter-spacing:3px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.cube{animation:none}.tower{transition:none}}
@media (min-width:600px){h1{font-size:60px}.legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="wrap cover">
  <img class="logo" src="logo.png" alt="에이전틱 AI 얼라이언스" onerror="this.remove()">
  <p class="eyebrow" id="org"></p>
  <h1 id="title"></h1>
  <p class="date" id="date"></p>
  <section class="city" id="city" aria-label="분야별 참여기업 수">
    <svg id="towers" role="presentation"></svg>
    <p class="caption" id="caption"></p>
    <ul class="legend" id="legend"></ul>
  </section>
</header>

<div class="bar">
  <div class="wrap">
    <input id="q" type="text" enterkeyhint="search" placeholder="기업명, 기술, 니즈 검색" autocomplete="off" aria-label="기업명, 기술, 니즈 검색">
    <div class="type" id="type" role="group" aria-label="구분"></div>
  </div>
</div>

<main class="wrap">
  <div class="status" aria-live="polite"><span id="count"></span><button id="reset" type="button" hidden>조건 지우기</button></div>
  <div id="list"></div>
</main>
<footer>AGENTIC AI ALLIANCE</footer>

<script src="data.js"></script>
<script>
const ev = window.EVENT || {};
document.getElementById('org').textContent = ev.org || '';
document.getElementById('title').textContent = ev.title || '참여기업';
document.getElementById('date').textContent = ev.date || '';

// 분야별 색 — 리플렛 블록의 청·남·보라 계열에서
const COLOR = {
  '통신·IT서비스·인프라':'#4c86ff', '제조·생산·산업안전':'#6fe0ff', '의료·헬스케어·바이오':'#5cebc0',
  '공공·행정·국방':'#a58bff', '교육·HR·미디어·콘텐츠':'#f28be0', '물류·유통·커머스·농식품':'#ffc46b',
  '금융·보험·법무·규제':'#ff8f7a', '사이버보안':'#dfe6ff', '전산업':'#9aa6cc'
};
const colorOf = d => COLOR[d] || '#9aa6cc';
const shade = (hex, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join('');

// 가나다 정렬: (주)·㈜·주식회사 등은 빼고 비교
const sortKey = n => n.replace(/\(주\)|㈜|주\)|주식회사|\(.*?\)/g, '').trim();
const data = (window.COMPANIES || []).slice().sort((a, b) => sortKey(a.name).localeCompare(sortKey(b.name), 'ko'));
const INITIALS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const BASE = { 'ㄲ':'ㄱ', 'ㄸ':'ㄷ', 'ㅃ':'ㅂ', 'ㅆ':'ㅅ', 'ㅉ':'ㅈ' };
function initial(name) {
  const ch = sortKey(name).charCodeAt(0);
  if (ch >= 0xAC00 && ch <= 0xD7A3) { const c = INITIALS[Math.floor((ch - 0xAC00) / 588)]; return BASE[c] || c; }
  return 'A–Z';
}

// 아이소메트릭 큐브 하나 (윗면 중심 cx, cy)
const R = 13, Q = 6.5, V = 12;
function cube(cx, cy, col, delay) {
  const top = `${cx},${cy - Q} ${cx + R},${cy} ${cx},${cy + Q} ${cx - R},${cy}`;
  const left = `${cx - R},${cy} ${cx},${cy + Q} ${cx},${cy + Q + V} ${cx - R},${cy + V}`;
  const right = `${cx},${cy + Q} ${cx + R},${cy} ${cx + R},${cy + V} ${cx},${cy + Q + V}`;
  return `<g class="cube" style="animation-delay:${delay}ms"><polygon points="${left}" fill="${shade(col, .55)}"/><polygon points="${right}" fill="${shade(col, .35)}"/><polygon points="${top}" fill="${col}"/></g>`;
}
const swatch = col => `<svg width="16" height="18" viewBox="-13 -7 26 26" aria-hidden="true">${cube(0, 0, col, 0).replace('class="cube"', '')}</svg>`;

// 분야별 기업 수만큼 쌓은 탑
const domains = Object.entries(data.reduce((m, c) => (m[c.domain] = (m[c.domain] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
const STEP = 36, maxN = Math.max(...domains.map(d => d[1]));
const W = STEP * (domains.length - 1) + 2 * R, H = maxN * V + Q * 2 + V + 22;
const baseY = H - V - Q;
const $svg = document.getElementById('towers');
$svg.setAttribute('viewBox', `${-R} 0 ${W} ${H}`);
$svg.innerHTML = domains.map(([d, n], i) => {
  const cx = i * STEP, col = colorOf(d);
  let g = '';
  for (let k = 0; k < n; k++) g += cube(cx, baseY - k * V, col, i * 60 + k * 35);
  return `<g class="tower" data-d="${d}">${g}<text x="${cx}" y="${baseY - (n - 1) * V - Q - 6}" text-anchor="middle">${n}</text></g>`;
}).join('');
document.getElementById('caption').textContent = `참여기업 ${data.length}곳 · 블록 하나가 기업 하나입니다. 분야를 누르면 그 기업만 보입니다.`;
document.getElementById('legend').innerHTML = domains.map(([d, n]) =>
  `<li><button type="button" data-d="${d}" aria-pressed="false">${swatch(colorOf(d))}<span><span class="nm">${d}</span><span class="n">${n}</span></span></button></li>`).join('');

const types = ['회원사', '수요기업'];
document.getElementById('type').innerHTML = types.map(t => `<button type="button" data-t="${t}" aria-pressed="false">${t}</button>`).join('');

const state = { domain: '', type: '' };
const $q = document.getElementById('q'), $list = document.getElementById('list'), $count = document.getElementById('count'), $reset = document.getElementById('reset');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');

// 검색어를 공백 무시하고 찾아 <mark>로 감쌈
function hl(text, q) {
  const t = String(text);
  if (!q) return esc(t);
  const chars = [], map = [];
  for (let i = 0; i < t.length; i++) if (!/\s/.test(t[i])) { chars.push(t[i].toLowerCase()); map.push(i); }
  const hay = chars.join(''), hits = [];
  for (let i = hay.indexOf(q); i !== -1; i = hay.indexOf(q, i + q.length)) hits.push([map[i], map[i + q.length - 1] + 1]);
  let out = '', last = 0;
  for (const [s, e] of hits) { out += esc(t.slice(last, s)) + '<mark>' + esc(t.slice(s, e)) + '</mark>'; last = e; }
  return out + esc(t.slice(last));
}

function entry(c, q) {
  const col = colorOf(c.domain);
  return `<article class="co" style="--c:${col}">${swatch(col)}<div>
    <h2>${hl(c.name, q)}</h2>
    <p class="meta"><span class="${c.type === '수요기업' ? 'demand' : ''}">${esc(c.type)}</span> · ${hl(c.domain, q)}</p>
    <p class="lab">기술·서비스</p><ul class="svc">${c.services.map(s => `<li>${hl(s, q)}</li>`).join('')}</ul>
    <p class="lab">협업 니즈</p><div class="need"><ul>${c.needs.map(s => `<li>${hl(s, q)}</li>`).join('')}</ul></div>
  </div></article>`;
}

function render() {
  const q = norm($q.value.trim());
  const rows = data.filter(c => (!state.domain || c.domain === state.domain) && (!state.type || c.type === state.type)
    && (!q || norm([c.name, c.domain, c.type, ...c.services, ...c.needs].join(' ')).includes(q)));
  const groups = [];
  rows.forEach(c => { const k = initial(c.name); (groups.at(-1)?.k === k ? groups.at(-1) : (groups.push({ k, items: [] }), groups.at(-1))).items.push(c); });
  $list.innerHTML = rows.length ? groups.map(g => `<section class="group"><h3 class="initial">${g.k}<small>${g.items.length}곳</small></h3>${g.items.map(c => entry(c, q)).join('')}</section>`).join('')
    : '<p class="empty">조건에 맞는 기업이 없습니다. 검색어나 분야를 바꿔 보세요.</p>';
  const filtered = q || state.domain || state.type;
  $count.textContent = filtered ? `${[state.domain, state.type].filter(Boolean).join(' · ') || '검색 결과'} ${rows.length}곳` : `전체 ${data.length}곳 · 가나다순`;
  $reset.hidden = !filtered;
  document.getElementById('city').classList.toggle('has-pick', !!state.domain);
  document.querySelectorAll('.tower').forEach(t => t.classList.toggle('on', t.dataset.d === state.domain));
  document.querySelectorAll('.legend button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === state.domain)));
  document.querySelectorAll('.type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === state.type)));
}

function pickDomain(d) {
  state.domain = state.domain === d ? '' : d;
  render();
  if (state.domain) document.querySelector('.bar').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
$svg.addEventListener('click', e => { const t = e.target.closest('.tower'); if (t) pickDomain(t.dataset.d); });
document.getElementById('legend').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pickDomain(b.dataset.d); });
document.getElementById('type').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.type = state.type === b.dataset.t ? '' : b.dataset.t; render(); } });
$q.addEventListener('input', render);
$reset.addEventListener('click', () => { state.domain = ''; state.type = ''; $q.value = ''; render(); });
render();
</script>
</body>
</html>
